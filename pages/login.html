<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - CoffeeManager</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <style>
        /* CSS riêng cho trang login - đặt inline vì chỉ dùng ở đúng 1 trang này */
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
        }
        .login-box {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 36px 32px;
        }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo .icon { font-size: 40px; }
        .login-logo h1 { font-size: 20px; color: var(--color-primary-dark); margin-top: 8px; }
        .login-logo p { font-size: 13px; color: var(--color-text-muted); margin-top: 4px; }
        .login-box .btn { width: 100%; margin-top: 8px; padding: 11px; }
        .login-hint { margin-top: 18px; text-align: center; font-size: 12px; color: var(--color-text-muted); }
    </style>
</head>
<body class="login-body">

    <div class="login-box">
        <div class="login-logo">
            <div class="icon">☕</div>
            <h1>CoffeeManager</h1>
            <p>Đăng nhập để quản lý quán cà phê của bạn</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="vd: admin" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" id="login-submit-btn" class="btn btn-primary">Đăng nhập</button>
        </form>

    </div>

    <!-- Thứ tự nhúng JS quan trọng: api.js -> common.js -> auth.js -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
