<!--
    FILE: pages/categories.html
    -----------------------------------------------------------------------
    1. File này dùng để làm gì?
       Trang quản lý danh mục sản phẩm: danh sách, tìm kiếm, thêm, sửa,
       xóa, đổi trạng thái.
    2. File này giao tiếp với file nào?
       ../assets/css/common.css, categories.css, responsive.css
       ../assets/js/api.js, common.js, categories.js
    3. File này gọi API nào? (thông qua categories.js)
       backend/api/categories/list.php, create.php, update.php, delete.php
    4. Dữ liệu đi theo hướng nào?
       Trang load -> categories.js gọi list.php -> render bảng
       Thêm/sửa/xóa -> gọi create/update/delete.php -> SQL Server -> JSON
       -> categories.js load lại bảng
    -----------------------------------------------------------------------
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục - CoffeeManager</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/categories.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

    <div class="app-layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-logo">
                <span class="icon">☕</span>
                <span class="logo-text">CoffeeManager</span>
            </div>
            <ul class="sidebar-menu">
                <li><a href="../index.html"><span class="menu-icon">📊</span><span>Dashboard</span></a></li>
                <li><a href="pos.html"><span class="menu-icon">🛒</span><span>Bán hàng (POS)</span></a></li>
                <li><a href="products.html"><span class="menu-icon">☕</span><span>Sản phẩm</span></a></li>
                <li><a href="categories.html" class="active"><span class="menu-icon">🏷️</span><span>Danh mục</span></a></li>
                <li><a href="tables.html"><span class="menu-icon">🍽️</span><span>Bàn</span></a></li>
                <li><a href="orders.html"><span class="menu-icon">🧾</span><span>Đơn hàng</span></a></li>
                <li><a href="customers.html"><span class="menu-icon">👥</span><span>Khách hàng</span></a></li>
                <li><a href="employees.html"><span class="menu-icon">🧑‍💼</span><span>Nhân viên</span></a></li>
                <li><a href="inventory.html"><span class="menu-icon">📦</span><span>Kho</span></a></li>
                <li><a href="suppliers.html"><span class="menu-icon">🚚</span><span>Nhà cung cấp</span></a></li>
                <li><a href="reports.html"><span class="menu-icon">📈</span><span>Báo cáo</span></a></li>
                <li><a href="settings.html"><span class="menu-icon">⚙️</span><span>Cài đặt</span></a></li>
            </ul>
        </aside>

        <div class="main-content">
            <!-- ===== HEADER ===== -->
            <header class="header">
                <div class="header-left">
                    <button class="header-toggle-btn" id="sidebar-toggle-btn">☰</button>
                    <h1 class="header-title">Quản lý danh mục</h1>
                </div>
                <div class="header-right">
                    <div class="header-user">
                        <div class="avatar" id="current-user-avatar">A</div>
                        <div>
                            <div class="user-name" id="current-user-name">...</div>
                            <div class="user-role" id="current-user-role">...</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="logout-btn">Đăng xuất</button>
                </div>
            </header>

            <main class="page-body">

                <div class="toolbar">
                    <div class="search-box">
                        <span class="icon">🔍</span>
                        <input type="text" id="search-input" class="form-control" placeholder="Tìm danh mục theo tên...">
                    </div>
                    <button class="btn btn-primary" id="add-category-btn">+ Thêm danh mục</button>
                </div>

                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Tên danh mục</th>
                                <th>Mô tả</th>
                                <th>Số sản phẩm</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="categories-tbody">
                            <tr><td colspan="5" class="table-empty">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>
    </div>

    <!-- ===== MODAL: Thêm / Sửa danh mục ===== -->
    <div class="modal-overlay hidden" id="category-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="category-modal-title">Thêm danh mục</h3>
                <button class="modal-close-btn" onclick="closeModal('category-modal')">✕</button>
            </div>
            <form id="category-form">
                <div class="modal-body">
                    <input type="hidden" id="category-id">

                    <div class="form-group">
                        <label class="form-label">Tên danh mục *</label>
                        <input type="text" id="category-name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mô tả</label>
                        <textarea id="category-description" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Trạng thái</label>
                        <select id="category-status" class="form-control">
                            <option value="1">Đang hoạt động</option>
                            <option value="0">Ngừng hoạt động</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('category-modal')">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="category-submit-btn">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Thứ tự nhúng JS: api.js -> common.js -> categories.js -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/categories.js"></script>
</body>
</html>
